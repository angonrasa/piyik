<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 682 682" class="piyik-logo-svg">
  <style>
    .piyik-logo-svg .entrance {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      opacity: 0;
      transform: scale(0.82);
      animation: piyik-entrance 650ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    .piyik-logo-svg .piece-main,
    .piyik-logo-svg .piece-arc {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
      animation-delay: 650ms;
    }
    .piyik-logo-svg .piece-main {
      animation-name: piyik-sway-main;
      animation-duration: 6.5s;
    }
    .piyik-logo-svg .piece-arc {
      animation-name: piyik-sway-arc;
      animation-duration: 5.8s;
    }
    @keyframes piyik-entrance {
      from { opacity: 0; transform: scale(0.82); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes piyik-sway-main {
      0%, 100% { transform: rotate(-2.2deg); }
      50%      { transform: rotate(2.2deg); }
    }
    @keyframes piyik-sway-arc {
      0%, 100% { transform: rotate(2.6deg); }
      50%      { transform: rotate(-2.6deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .piyik-logo-svg .entrance,
      .piyik-logo-svg .piece-main,
      .piyik-logo-svg .piece-arc {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
